[project]
name = "antsbot-nav"
version = "0.1.0"
description = "AntsBot Navigation Module"
readme = "README.md"
authors = [
    { name = "EarthlyEric", email = "earthlyeric6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["maturin>=1.14.1"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "accelerator/Cargo.toml"
module-name = "antsbot_nav.accelerator"
python-source = "src"

[dependency-groups]
dev = [
    "maturin>=1.14.1",
]
